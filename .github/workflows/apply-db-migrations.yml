name: Apply DB Migrations

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: "Comma-separated migration apply scripts under scripts/"
        required: false
        type: string
        default: "apply-malshabim-status-v2-migration.mjs,apply-nagadim-enrichment-migration.mjs,apply-notification-media-migration.mjs,apply-agam-cycle-invite-slug-migration.mjs"

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations on production DB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install tools
        run: |
          npm install -g vercel@54.21.1
          npm install @neondatabase/serverless

      - name: Apply migrations via vercel env run
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_5Jr6kmHO1mgNWZlHQONoHm5V
          VERCEL_PROJECT_ID: prj_TRU7eh4N9sk1T1BYXEcze4E9AC0g
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # Prefer explicit GitHub secret when present
          if [ -n "${DATABASE_URL_SECRET:-}" ] && [[ "$DATABASE_URL_SECRET" == postgres* ]]; then
            export DATABASE_URL="$DATABASE_URL_SECRET"
            echo "source=GITHUB_SECRET"
            host="$(node -e "console.log(new URL(process.env.DATABASE_URL.replace(/^postgresql:/i,'http:')).host)")"
            echo "production db host=$host"
            touch .env.local
            IFS=',' read -ra SCRIPTS <<< "${{ github.event.inputs.migrations }}"
            for script in "${SCRIPTS[@]}"; do
              script="$(echo "$script" | xargs)"
              [ -z "$script" ] && continue
              echo "::group::Running scripts/$script"
              node "scripts/$script"
              echo "::endgroup::"
            done
            exit 0
          fi

          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          touch .env.local

          # vercel env run injects production secrets into the child process
          IFS=',' read -ra SCRIPTS <<< "${{ github.event.inputs.migrations }}"
          for script in "${SCRIPTS[@]}"; do
            script="$(echo "$script" | xargs)"
            [ -z "$script" ] && continue
            echo "::group::Running scripts/$script via vercel env run"
            # Prevent local wrong .env.local from overriding; empty file is fine
            vercel env run -e production --token "$VERCEL_TOKEN" -- node "scripts/$script"
            echo "::endgroup::"
          done
