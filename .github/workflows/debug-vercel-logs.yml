name: Debug Vercel Logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Probe DB + Vercel runtime logs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_5Jr6kmHO1mgNWZlHQONoHm5V
          VERCEL_PROJECT_ID: prj_TRU7eh4N9sk1T1BYXEcze4E9AC0g
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          npm install -g vercel@54.21.1 @neondatabase/serverless

          echo "== DB probe =="
          node <<'NODE'
          const { neon } = require("@neondatabase/serverless");
          const url = process.env.DATABASE_URL;
          if (!url) { console.error("no DATABASE_URL"); process.exit(1); }
          console.log("host", url.replace(/:[^:@/]+@/, ":***@").split("@")[1]?.split("/")[0]);
          const sql = neon(url);
          (async () => {
            try {
              const rows = await sql`select current_database() as db, now() as ts, (select count(*)::int from profiles) as profiles`;
              console.log("db_ok", rows);
            } catch (e) {
              console.error("db_fail", e && e.message ? e.message : e);
              process.exitCode = 2;
            }
          })();
          NODE

          echo "== nextauth/url check via vercel pull names =="
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" || true
          if [ -f .vercel/.env.production.local ]; then
            python3 - <<'PY'
          from pathlib import Path
          for line in Path(".vercel/.env.production.local").read_text().splitlines():
              if not line or line.startswith("#") or "=" not in line: continue
              k,v=line.split("=",1)
              empty = v.strip() in ('', '""', "''")
              print(f"{k}\tempty={empty}\tlen={len(v.strip().strip(chr(34)).strip(chr(39)))}")
          PY
          fi

          echo "== vercel logs (last 5m) =="
          DEPLOY_URL=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["deployments"][0]["url"])')
          echo "deploy_url=$DEPLOY_URL"
          vercel logs "$DEPLOY_URL" --token="$VERCEL_TOKEN" 2>&1 | tail -n 120 || true
