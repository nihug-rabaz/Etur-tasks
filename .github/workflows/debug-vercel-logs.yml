name: Debug Vercel Logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Vercel project env and recent deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_TRU7eh4N9sk1T1BYXEcze4E9AC0g
          VERCEL_TEAM_ID: team_5Jr6kmHO1mgNWZlHQONoHm5V
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

          echo "== deployments =="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=5" \
            > /tmp/deps.json
          python3 <<'PY'
          import json
          d=json.load(open("/tmp/deps.json"))
          for x in d.get("deployments", []):
              print(x.get("uid"), x.get("state"), x.get("readyState"), x.get("url"))
          PY

          echo "== env keys =="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID" \
            > /tmp/envs.json
          python3 <<'PY'
          import json, os
          d=json.load(open("/tmp/envs.json"))
          keys=[]
          for e in d.get("envs", []):
              key=e.get("key")
              keys.append(key)
              val=e.get("value")
              typ=e.get("type")
              targets=",".join(e.get("target") or [])
              empty = (val in (None, "", "[SENSITIVE]")) and typ != "encrypted"
              # encrypted secrets usually have no plaintext value in API
              status = "encrypted/sensitive" if typ in ("encrypted","sensitive") or val in (None,"") else ("EMPTY" if val=="" else "has-value")
              print(f"{key}\ttargets={targets}\ttype={typ}\t{status}")
          needed=["DATABASE_URL","NEXTAUTH_URL","NEXTAUTH_SECRET","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET"]
          print("== missing critical ==")
          for k in needed:
              print(k, "OK" if k in keys else "MISSING")
          print("github_secret_DATABASE_URL", "set" if os.environ.get("DATABASE_URL_SECRET") else "missing")
          PY
