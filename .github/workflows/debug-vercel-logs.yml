name: Debug Vercel Logs

on:
  workflow_dispatch:
    inputs:
      query:
        description: Error id or path hint
        required: false
        default: ""

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recent Vercel runtime logs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_TRU7eh4N9sk1T1BYXEcze4E9AC0g
          VERCEL_TEAM_ID: team_5Jr6kmHO1mgNWZlHQONoHm5V
          QUERY: ${{ github.event.inputs.query }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN missing"
            exit 1
          fi
          echo "== deployments =="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=5" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); 
print("\n".join(f"{x.get(\"uid\")} {x.get(\"state\")} {x.get(\"url\")} {x.get(\"created\")}" for x in d.get("deployments",[])))'
          DEPLOY=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["deployments"][0]["uid"])')
          echo "deploy=$DEPLOY"
          echo "== env keys (names only) =="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin);
for e in d.get("envs",[]):
  print(e.get("key"), e.get("target"), e.get("type"), "empty" if e.get("value")=="" else "set")'
          echo "== runtime logs =="
          # Try runtime logs endpoint
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/deployments/$DEPLOY/runtime-logs?teamId=$VERCEL_TEAM_ID&limit=50" \
            | head -c 20000 || true
          echo
          echo "== deployments events =="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/deployments/$DEPLOY/events?teamId=$VERCEL_TEAM_ID&builds=1&direction=backward&limit=40" \
            | python3 -c 'import json,sys,re
raw=sys.stdin.read()
try:
  d=json.loads(raw)
except Exception:
  print(raw[:5000]); raise SystemExit
items=d if isinstance(d,list) else d.get("events") or d.get("builds") or []
for e in items[-40:]:
  text=json.dumps(e, ensure_ascii=False)
  if any(k in text.lower() for k in ["error","fail","exception","database","missing","3834153112", (sys.argv[1].lower() if len(sys.argv)>1 else "____")]):
    print(text[:1000])
' "$QUERY" || true
